<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="Boutique Fortnite en temps réel."
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Fortnite Shop</title>

</head>

<body>


<header class="site-header">

    <div class="header-inner">

        <a
            class="brand"
            href="./"
        >

            <span class="brand-main">
                FORTNITE
            </span>

            <span class="brand-sub">
                SHOP
            </span>

        </a>


        <div class="header-actions">

            <a
                class="epic-link"
                href="https://www.epicgames.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Epic Games
            </a>

            <button
                id="refresh-btn"
                class="refresh-btn"
                type="button"
            >
                Actualiser
            </button>

        </div>

    </div>

</header>


<main>


    <section class="hero">

        <div class="hero-content">

            <p class="eyebrow">
                BOUTIQUE DU JOUR
            </p>

            <h1>
                Fortnite Shop
            </h1>

            <p class="hero-description">
                Découvre les objets actuellement
                disponibles dans la boutique Fortnite.
            </p>

            <div class="shop-meta">

                <span id="shop-date">
                    Boutique actuelle
                </span>

                <span
                    id="status"
                    aria-live="polite"
                >
                    Chargement…
                </span>

            </div>

        </div>

    </section>


    <section
        id="shop"
        class="shop-container"
    ></section>


</main>


<footer class="site-footer">

    <div class="footer-inner">

        <p>
            Fortnite Shop — site non officiel.
        </p>

        <a href="privacy.html">
            Politique de confidentialité
        </a>

    </div>

</footer>



<!-- ===================================================== -->
<!-- MODAL -->
<!-- ===================================================== -->

<div
    id="item-modal"
    class="item-modal"
    aria-hidden="true"
>

    <div class="modal-backdrop"></div>


    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-label="Aperçu de l'objet"
    >


        <button
            id="modal-close"
            class="modal-close"
            type="button"
            aria-label="Fermer"
        >
            ×
        </button>


        <!-- ================================================= -->
        <!-- IMAGE / VIDÉO PRINCIPALE -->
        <!-- ================================================= -->

        <div class="modal-media">

            <div
                id="preview-track"
                class="preview-track"
            >

                <div class="preview-slide">

                    <img
                        id="preview-image"
                        src=""
                        alt=""
                    >

                </div>


                <div
                    class="
                        preview-slide
                        preview-video-slide
                    "
                >

                    <video
                        id="preview-video"
                        muted
                        playsinline
                        controls
                    >

                        <source
                            id="preview-video-source"
                            src=""
                        >

                    </video>

                </div>

            </div>


            <div
                id="preview-status"
                class="preview-status"
            ></div>


            <div
                id="preview-dots"
                class="preview-dots"
            ></div>

        </div>



        <!-- ================================================= -->
        <!-- CARROUSEL DES OBJETS DU PACK -->
        <!-- ================================================= -->

        <div
            id="pack-carousel"
            class="pack-carousel"
        >

            <button
                id="pack-carousel-prev"
                class="pack-carousel-arrow pack-carousel-prev"
                type="button"
                aria-label="Objet précédent"
            >
                ‹
            </button>


            <div
                class="pack-carousel-window"
            >

                <div
                    id="pack-carousel-track"
                    class="pack-carousel-track"
                ></div>

            </div>


            <button
                id="pack-carousel-next"
                class="pack-carousel-arrow pack-carousel-next"
                type="button"
                aria-label="Objet suivant"
            >
                ›
            </button>

        </div>



        <!-- ================================================= -->
        <!-- INFORMATIONS -->
        <!-- ================================================= -->

        <div class="modal-info">

            <div class="modal-info-top">

                <div>

                    <p
                        id="modal-extra"
                        class="modal-extra"
                    ></p>

                    <h2 id="modal-name">
                        Objet Fortnite
                    </h2>

                </div>


                <div
                    id="modal-price"
                    class="modal-price"
                ></div>

            </div>


            <p
                id="modal-description"
                class="modal-description"
            ></p>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
