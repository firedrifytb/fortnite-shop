<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#070b18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img_2234.jpeg">
    <link rel="stylesheet" href="style.css">

    <title>Fortnite Shop</title>
</head>

<body>

    <div class="background">
        <div class="orb orb-blue"></div>
        <div class="orb orb-purple"></div>
        <div class="grid-background"></div>
    </div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="header-inner">

            <div class="brand">

                <div class="brand-logo">
                    ⚡
                </div>

                <div class="brand-text">

                    <h1>
                        FORTNITE <span>SHOP</span>
                    </h1>

                    <p>
                        Boutique quotidienne
                    </p>

                </div>

            </div>


            <div class="date-box">

                <span class="date-label">
                    BOUTIQUE DU
                </span>

                <div id="date"></div>

            </div>


            <div class="actions">

                <a
                    class="login-button"
                    href="https://fortnite-shop.firedrifytb.workers.dev/login"
                >

                    <span class="epic-icon">
                        🎮
                    </span>

                    <span class="login-content">

                        <small>
                            COMPTE EPIC
                        </small>

                        Se connecter

                    </span>

                </a>


                <button
                    class="refresh-button"
                    onclick="loadShop()"
                    aria-label="Actualiser la boutique"
                >

                    <span class="refresh-icon">
                        ↻
                    </span>

                    <span class="refresh-text">
                        Actualiser
                    </span>

                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <section class="shop-heading">

            <div class="heading-content">

                <span class="section-label">
                    FORTNITE
                </span>

                <h2>
                    Boutique d'objets
                </h2>

                <p>
                    Découvrez les objets disponibles aujourd'hui.
                </p>

            </div>


            <div class="live-badge">

                <span></span>

                EN DIRECT

            </div>

        </section>


        <div id="status">

            <div class="loading-container">

                <div class="loading-spinner"></div>

                <span>
                    Chargement de la boutique...
                </span>

            </div>

        </div>


        <section id="shop"></section>

    </main>


    <!-- =====================================================
         MODAL OBJET
    ====================================================== -->

    <div
        id="item-modal"
        class="item-modal"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-name"
        >


            <!-- =================================================
                 CLOSE
            ================================================== -->

            <button
                id="modal-close"
                class="modal-close"
                aria-label="Fermer"
            >
                ×
            </button>


            <!-- =================================================
                 MEDIA
            ================================================== -->

            <div class="modal-media">


                <!-- VIDEO -->

                <video
                    id="modal-video"
                    class="modal-video"
                    muted
                    loop
                    playsinline
                    preload="metadata"
                ></video>


                <!-- IMAGE FALLBACK -->

                <img
                    id="modal-image"
                    class="modal-image"
                    src=""
                    alt=""
                >


                <!-- VIDEO OVERLAY -->

                <div
                    id="video-overlay"
                    class="video-overlay"
                >

                    <button
                        id="video-sound"
                        class="media-button"
                        type="button"
                        aria-label="Activer le son"
                    >
                        🔇
                    </button>


                    <button
                        id="video-fullscreen"
                        class="media-button"
                        type="button"
                        aria-label="Plein écran"
                    >
                        ⛶
                    </button>

                </div>


                <!-- PREVIEW LABEL -->

                <div
                    id="preview-status"
                    class="preview-status"
                >
                    Aperçu de l'objet
                </div>


                <!-- VIDEO LOADING -->

                <div
                    id="video-loading"
                    class="video-loading"
                >

                    <div class="video-loading-spinner"></div>

                    <span>
                        Chargement de l'aperçu...
                    </span>

                </div>

            </div>


            <!-- =================================================
                 INFORMATIONS
            ================================================== -->

            <div class="modal-info">


                <div class="modal-top-line">

                    <span class="modal-label">
                        OBJET FORTNITE
                    </span>

                    <span
                        id="modal-rarity"
                        class="modal-rarity"
                    ></span>

                </div>


                <h2 id="modal-name"></h2>


                <div
                    id="modal-price"
                    class="modal-price"
                ></div>


                <!-- TAGS -->

                <div
                    id="modal-tags"
                    class="modal-tags"
                ></div>


                <!-- DESCRIPTION -->

                <div
                    id="modal-description"
                    class="modal-description"
                ></div>


                <!-- INTRODUCTION -->

                <div
                    id="modal-introduction"
                    class="modal-introduction"
                ></div>


                <!-- SET -->

                <div
                    id="modal-set"
                    class="modal-set"
                ></div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-logo">
            FORTNITE SHOP
        </div>

        <div class="footer-line"></div>

        <p>
            Non affilié à Epic Games.
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
